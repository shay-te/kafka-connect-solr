# Head-to-head Solr-vs-Elasticsearch connector benchmark.
#
# Runs on a GitHub-hosted ubuntu-latest runner, which has Docker preinstalled — so the
# Testcontainers-based SolrVsElasticsearchPerfTest can start a real solr:9.4 and a real
# elasticsearch:7.17.24 and push the same load through both. This is the run that produces
# the actual "who is faster" numbers (it cannot run on a machine without Docker).
#
# Trigger it manually from the Actions tab (workflow_dispatch). Read the "[HEAD-TO-HEAD]"
# line in the job log; JFR + surefire reports are uploaded as artifacts.
name: perf-benchmark (solr vs elasticsearch)

on:
  workflow_dispatch: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest        # Docker is preinstalled on GitHub-hosted runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Confirm Docker is available
        run: docker info

      - name: Run head-to-head benchmark
        # -Pperf selects the @Tag("performance") tests; -Dsurefire.useFile=false streams the
        # [HEAD-TO-HEAD] printf straight to the job log instead of only a report file.
        run: >
          mvn -B test -Pperf
          -Dtest=SolrVsElasticsearchPerfTest
          -Dsurefire.useFile=false

      - name: Upload JFR recordings + surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: |
            target/perf-jfr/**
            target/surefire-reports/**
          if-no-files-found: warn
